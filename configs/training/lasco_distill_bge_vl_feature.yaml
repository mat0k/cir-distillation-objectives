version: 1
experiment_name: vista-lasco-distill-BGE-VL-feature
seed: 42

training_mode: distillation

# Student = best LaSCo-finetuned VISTA (contrastive v2, epoch 1) — NOT zero-shot.
model:
  model_name_or_path: BAAI/bge-base-en-v1.5
  checkpoint_path: results/training/vista_lasco_finetune_contrastive_v2/checkpoints/vista_epoch01.pth
  from_pretrained: null

training:
  epochs: 10
  batch_size: 128
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-6
  weight_decay: 1.0e-2
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  precision: bf16
  num_workers: 4
  save_every_n_epochs: 1
  eval_every_n_epochs: 1
  log_every_n_steps: 50

freeze:
  strategy: top_layers_only
  bge_freeze_bottom_n_layers: 9

# LaSCo ONLY. RANDOM batching (the arm that won the SP study).
# Both teacher caches are 4096-d (verified from the .pt files, not assumed).
data:
  lasco_sp_distill:
    subset_path: data/lasco/distill_subset.json
    teacher_cand_emb_path: data/lasco/bge_vl_cand_emb.pt
    teacher_query_emb_path: data/lasco/bge_vl_query_emb.pt
    images_dir: data/lasco/images
    cluster_labels_path: null

# FEATURE-based KD: match the student's embedding to the teacher's coordinates.
# feature_mode: up -> trainable Linear(768 -> 4096), alignment in TEACHER space
# (the EmbedDistill-preferred direction). Teacher dim is read from the cache at
# runtime, never hardcoded.
distillation:
  loss: feature
  teacher: bge_vl_mllm_s1
  feature_mode: up
  feature_head: linear        # NOT mlp — an expressive head absorbs the signal (CRD lesson)
  student_dim: 768
  feat_weight: 1.0            # start at 1.0, retune off the step-50 balance line
  align_query: true
  align_candidate: true
  projector_lr: 1.0e-3        # separate group; backbone lr 1e-6 would never train it
  lambda_contrastive: 1.0     # CE anchor — kept in every arm, never dropped
  contrastive_temperature: 0.02

evaluation:
  datasets: [fashioniq, cirr]
  batch_size: 128
  num_workers: 4
  query_embedding_mode: vista_mm
  fusion_type: sum
  fashioniq_eval_protocol: val_split
  k_values: [1, 5, 10, 15, 50]

outputs:
  root_dir: results/bge_vl
  run_name: distill_bge_vl_feature
