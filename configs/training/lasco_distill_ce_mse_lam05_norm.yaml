version: 1
experiment_name: vista-lasco-distill-ce-mse-lam05-norm
seed: 42

training_mode: distillation

model:
  model_name_or_path: BAAI/bge-base-en-v1.5
  checkpoint_path: results/training/vista_lasco_finetune_contrastive_v2/checkpoints/vista_epoch01.pth
  from_pretrained: null

training:
  epochs: 5
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-6
  weight_decay: 1.0e-2
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  precision: bf16
  num_workers: 4
  save_every_n_epochs: 1
  eval_every_n_epochs: 1
  log_every_n_steps: 200

freeze:
  strategy: top_layers_only
  bge_freeze_bottom_n_layers: 9

data:
  lasco_distill:
    subset_path: data/lasco/distill_subset.json
    scores_path: data/lasco/teacher_scores_qwen.json
    images_dir: data/lasco/images
  num_negatives: 15

distillation:
  loss: combined
  teacher: qwen3vl_2b
  soft_labels_path: data/lasco/teacher_scores_qwen.json
  lambda_distill: 0.5            # 50% MarginMSE distillation + 50% CE contrastive
  contrastive_temperature: 0.02
  distill_component: margin_mse
  normalize_scores: true         # per-query z-score of teacher+student before distill loss (FIX)

evaluation:
  datasets: [fashioniq, cirr]
  batch_size: 64
  num_workers: 4
  query_embedding_mode: vista_mm
  fusion_type: sum
  fashioniq_eval_protocol: val_split
  k_values: [1, 5, 10, 15, 50]

outputs:
  root_dir: results/training
  run_name: vista_lasco_distill_ce_mse_lam05_norm
