version: 1
experiment_name: vista-lasco-distill-BGE-VL-sp-w3000-ce0.1
seed: 42

training_mode: distillation

# Student = best LaSCo-finetuned VISTA (contrastive v2, epoch 1) — NOT zero-shot.
model:
  model_name_or_path: BAAI/bge-base-en-v1.5
  checkpoint_path: results/training/vista_lasco_finetune_contrastive_v2/checkpoints/vista_epoch01.pth
  from_pretrained: null

# batch_size = N pairs per cluster-batch (the SP Gram is N x N).
training:
  epochs: 10
  batch_size: 128
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-6
  weight_decay: 1.0e-2
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  precision: bf16
  num_workers: 4
  save_every_n_epochs: 1
  eval_every_n_epochs: 1
  log_every_n_steps: 50

freeze:
  strategy: top_layers_only
  bge_freeze_bottom_n_layers: 9

# LaSCo ONLY. RANDOM batching (floor, off-diag ~0.09).
data:
  lasco_sp_distill:
    subset_path: data/lasco/distill_subset.json
    teacher_cand_emb_path: data/lasco/bge_vl_cand_emb.pt
    images_dir: data/lasco/images
    cluster_labels_path: null

# SP (candidate-candidate similarity-preserving) + CE anchor on TRUE positives.
distillation:
  loss: sp
  teacher: bge_vl_mllm_s1
  sp_weight: 3000.0           # KEY KNOB: aim sp_weight*sp ~ ce (SP paper uses large gamma)
  # Swept down from 1.0. On MagicLens, lambda_ce=0.1 lifted the SP gain from
  # +0.0/+1.57 to +1.62/+2.07 -- the anchor was suppressing the transfer, not
  # supporting it. VISTA's headline SP result was produced at the untuned 1.0,
  # so this checks whether it is also leaving gain on the table.
  lambda_contrastive: 0.1
  contrastive_temperature: 0.02
  fn_threshold: 0.8           # false-negative meter: teacher cos(neg, true target) > this

evaluation:
  datasets: [fashioniq, cirr]
  batch_size: 128
  num_workers: 4
  query_embedding_mode: vista_mm
  fusion_type: sum
  fashioniq_eval_protocol: val_split
  k_values: [1, 5, 10, 15, 50]

outputs:
  root_dir: results/bge_vl
  run_name: distill_bge_vl_sp_w3000_ce0.1
