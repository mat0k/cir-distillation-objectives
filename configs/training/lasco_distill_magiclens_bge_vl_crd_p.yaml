# CRD-P (relation-based): learned projection on BOTH sides. Otherwise identical to the MagicLens CRD-N run.
# Paper Table: unsupervised distillation by knowledge family (BGE-VL-MLLM-S1 teacher, val split).
version: 1
experiment_name: magiclens-lasco-distill-BGE-VL-crd-p
seed: 42
training_mode: distillation
model:
  type: magiclens
  model_size: base
  model_name_or_path: magiclens-base
  checkpoint_path: models/magiclens/magic_lens_clip_base.pt
training:
  epochs: 10
  batch_size: 128
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-06
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  precision: bf16
  num_workers: 4
  save_every_n_epochs: 1
  eval_every_n_epochs: 1
  log_every_n_steps: 50
freeze:
  strategy: magiclens_head_only
  clip_train_top_n_text_layers: 0
data:
  lasco_sp_distill:
    subset_path: data/lasco/distill_subset.json
    teacher_cand_emb_path: data/lasco/bge_vl_cand_emb.pt
    images_dir: data/lasco/images
    cluster_labels_path: null
distillation:
  loss: crd
  teacher: bge_vl_mllm_s1
  crd_weight: 1.0
  crd_temperature: 0.07
  projection_dim: 128
  student_dim: 512
  teacher_dim: 4096
  projector_lr: 0.001
  student_projector: mlp
  teacher_projector: mlp
  lambda_contrastive: 0.1
  contrastive_temperature: 0.02
  fn_threshold: 0.8
evaluation:
  datasets:
  - fashioniq
  - cirr
  batch_size: 128
  num_workers: 4
  query_embedding_mode: vista_mm
  fusion_type: sum
  fashioniq_eval_protocol: val_split
  k_values:
  - 1
  - 5
  - 10
  - 15
  - 50
outputs:
  root_dir: results/magiclens
  run_name: distill_magiclens_bge_vl_crd_p
